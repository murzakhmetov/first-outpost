<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2333" />
    <meta name="color-scheme" content="dark" />
    <title>First Outpost — Junior Astronaut Mission Trainer</title>
    <meta
      name="description"
      content="Run a Moon or Mars outpost. Every choice costs something. A free browser game built on real NASA data for ages 7 to 12."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2333;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        /* No double-tap zoom, but pinch zoom stays allowed (the 3D canvas turns it off itself). */
        touch-action: manipulation;
      }
      #world {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* The loading screen: the same ivory-and-gold look as the title screen (src/ui/theme.css). */
      @font-face {
        font-family: 'Prata';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/node_modules/@fontsource/prata/files/prata-latin-400-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Prata';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/node_modules/@fontsource/prata/files/prata-cyrillic-400-normal.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #1d2333;
        color: #f4eee2;
        font: 600 16px/1.4 'Nunito Variable', system-ui, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.6s ease;
        z-index: 100;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .plate {
        position: relative;
        box-sizing: border-box;
        width: min(420px, 100%);
        padding: 26px 28px 24px;
        text-align: center;
        border: 1px solid #c9a55c;
        border-radius: 4px;
        box-shadow: inset 0 0 0 5px #1d2333, inset 0 0 0 6px #c9a55c, 0 0 0 1px rgba(0, 0, 0, 0.4);
      }
      #boot .plate::before,
      #boot .plate::after {
        content: '';
        position: absolute;
        left: 50%;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        background: #e4c57e;
        transform: rotate(45deg);
      }
      #boot .plate::before {
        top: -6px;
      }
      #boot .plate::after {
        bottom: -6px;
      }
      #boot .mark {
        display: block;
        width: 120px;
        height: 120px;
        margin: 0 auto 6px;
      }
      #boot .mark .orbit {
        transform-origin: 80px 80px;
        animation: boot-spin 24s linear infinite;
      }
      #boot .mark .twinkle {
        animation: boot-twinkle 2.4s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        text-align: center;
      }
      #boot #boot-name {
        font-family: 'Prata', Georgia, serif;
        font-weight: 400;
        font-size: 34px;
        line-height: 1.25;
        letter-spacing: 0.01em;
      }
      #boot .rule {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 200px;
        margin: 6px auto 16px;
      }
      #boot .rule::before,
      #boot .rule::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #c9a55c;
      }
      #boot .rule i {
        width: 10px;
        height: 10px;
        background: #c9a55c;
        transform: rotate(45deg);
      }
      #boot .bar {
        width: 220px;
        height: 10px;
        margin: 0 auto;
        border-radius: 3px;
        background: #2c3550;
        box-shadow: 0 0 0 1px #c9a55c;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 4%;
        height: 100%;
        background: #e4c57e;
        transition: width 0.25s ease;
      }
      #boot .fact {
        max-width: 320px;
        min-height: 4.6em;
        margin: 18px auto 0;
        font-size: 15px;
        line-height: 1.45;
        font-weight: 600;
        color: #dde1ec;
      }
      #boot .fact b {
        display: block;
        margin-bottom: 3px;
        color: #e4c57e;
        font-family: 'Prata', Georgia, serif;
        font-weight: 400;
        font-size: 17px;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-twinkle {
        50% {
          opacity: 0.4;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark .orbit,
        #boot .mark .twinkle {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="3D view of the outpost"></canvas>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="plate">
        <svg class="mark" viewBox="0 0 160 160" aria-hidden="true">
          <circle cx="80" cy="80" r="78" fill="#1d2333" stroke="#c9a55c" stroke-width="1.8" />
          <circle cx="80" cy="80" r="72" fill="#2c3550" stroke="#c9a55c" stroke-width="1" />
          <circle class="orbit" cx="80" cy="80" r="66" fill="none" stroke="#c9a55c" stroke-width="0.9" stroke-dasharray="1 4" stroke-linecap="round" />
          <path class="twinkle" d="M80 22L84 36L98 40L84 44L80 58L76 44L62 40L76 36Z" fill="#e4c57e" />
          <path d="M19.4 112Q80 94 140.6 112A66 66 0 0 1 19.4 112Z" fill="#f4eee2" stroke="#c9a55c" stroke-width="1.4" stroke-linejoin="round" />
          <g fill="none" stroke="#b9ae96" stroke-width="1.3">
            <circle cx="46" cy="126" r="6" />
            <circle cx="108" cy="130" r="4.5" />
            <circle cx="80" cy="140" r="3.4" />
          </g>
          <path d="M56 106A24 24 0 0 1 104 106Z" fill="#1d2333" stroke="#c9a55c" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M80 82V106M66 91Q66 98 62 106M94 91Q94 98 98 106" fill="none" stroke="#c9a55c" stroke-width="1" />
          <rect x="74" y="96" width="12" height="10" rx="5" fill="#f2d58a" />
          <path d="M80 82V70" stroke="#c9a55c" stroke-width="1.8" stroke-linecap="round" />
          <path d="M80 64l3.5 4L80 72l-3.5-4z" fill="#e4c57e" />
        </svg>
        <p id="boot-name">First Outpost</p>
        <div class="rule" aria-hidden="true"><i></i></div>
        <div class="bar" aria-hidden="true"><i></i></div>
        <p class="fact" id="boot-tip"></p>
      </div>
    </div>
    <script src="./boot.js"></script>
    <noscript>This game needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
