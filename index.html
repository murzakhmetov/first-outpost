<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1026" />
    <meta name="color-scheme" content="dark" />
    <title>First Outpost — Junior Astronaut Mission Trainer</title>
    <meta
      name="description"
      content="Run a Moon or Mars outpost. Every choice costs something. A free browser game built on real NASA data for ages 7 to 12."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1026;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        /* No double-tap zoom, but pinch zoom stays allowed (the 3D canvas turns it off itself). */
        touch-action: manipulation;
      }
      #world {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 40%, #1b2658 0%, #0b1026 60%, #05060f 100%);
        color: #f4f0e8;
        font: 600 16px/1.4 system-ui, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.6s ease;
        z-index: 100;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        display: block;
        width: 104px;
        height: 104px;
        margin: 0 auto 16px;
      }
      #boot .mark .orbit {
        transform-origin: 52px 52px;
        animation: boot-spin 7s linear infinite;
      }
      #boot .mark .twinkle {
        animation: boot-twinkle 2.4s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        text-align: center;
        opacity: 0.9;
        letter-spacing: 0.04em;
        font-size: 18px;
      }
      #boot .tip {
        max-width: 300px;
        min-height: 3.2em;
        margin: 18px auto 0;
        padding: 0 16px;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 0;
        opacity: 0.72;
      }
      #boot .tip b {
        display: block;
        margin-bottom: 2px;
        color: #ecd297;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 11px;
      }
      #boot .bar {
        width: 180px;
        height: 6px;
        margin: 16px auto 0;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 4%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #ecd297, #ffd166);
        transition: width 0.25s ease;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-twinkle {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark .orbit,
        #boot .mark .twinkle {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="3D view of the outpost"></canvas>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">
      <div>
        <svg class="mark" viewBox="0 0 104 104" aria-hidden="true">
          <defs>
            <linearGradient id="boot-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a4fa8" />
              <stop offset="0.62" stop-color="#e9a26b" />
              <stop offset="1" stop-color="#f6cf9a" />
            </linearGradient>
            <clipPath id="boot-disc"><circle cx="52" cy="52" r="34" /></clipPath>
          </defs>
          <g class="orbit">
            <circle cx="52" cy="52" r="48" fill="none" stroke="#ecd297" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.6" />
            <circle cx="52" cy="4" r="4.2" fill="#ffd166" />
          </g>
          <g clip-path="url(#boot-disc)">
            <rect x="18" y="18" width="68" height="68" fill="url(#boot-sky)" />
            <path d="M18 70 Q36 60 54 68 T86 64 V86 H18 Z" fill="#b5532f" />
            <path d="M18 76 Q40 68 60 75 T86 72 V86 H18 Z" fill="#8a3a22" />
            <path d="M39 70 a13 13 0 0 1 26 0 Z" fill="#f4f0e8" />
            <path d="M39 70 a13 13 0 0 1 4.6 -9.9 L46.5 70 Z" fill="#cfc8bb" />
            <rect x="48.5" y="62" width="7" height="8" rx="2.4" fill="#39c2f0" />
            <rect x="37" y="69" width="30" height="3" rx="1.5" fill="#d9d2c4" />
          </g>
          <circle cx="52" cy="52" r="34" fill="none" stroke="#ecd297" stroke-width="2.4" />
          <path class="twinkle" d="M70 30 l1.8 4.2 4.2 1.8 -4.2 1.8 -1.8 4.2 -1.8 -4.2 -4.2 -1.8 4.2 -1.8 Z" fill="#fff6d8" />
        </svg>
        <p id="boot-name">First Outpost</p>
        <div class="bar" aria-hidden="true"><i></i></div>
        <p class="tip" id="boot-tip"></p>
      </div>
    </div>
    <script src="./boot.js"></script>
    <noscript>This game needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
