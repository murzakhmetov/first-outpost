name: Update space weather

# Refreshes the "last 90 days" file from NASA DONKI once a day,
# so the "Sun right now" mode stays current without a server.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: space-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the last 90 days from NASA DONKI
        run: node scripts/fetch-donki.ts --latest
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- public/data/spaceweather-latest.json; then
            echo "No new records."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/spaceweather-latest.json
            git commit -m "Update space weather from NASA DONKI"
            # Someone may have pushed since the checkout.
            git pull --rebase
            git push
          fi
